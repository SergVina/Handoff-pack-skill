name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build skill ZIPs
        run: ./scripts/build-zip.sh

      - name: Attach ZIPs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/handoff-pack.zip dist/handoff-implement.zip --clobber
